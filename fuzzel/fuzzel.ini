[main]
font=FiraCode Nerd Font:weight=bold:size=10
dpi-aware=no
terminal=alacritty -e
prompt="❯ "
icon-theme=Papirus
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=5
line-height=20
lines=8
letter-spacing=0
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=042327ff
text=bdb395ff
match=86e08fff
selection=b59e7aa4
selection-text=000000ff
selection-match=bdb395ff
border=2ca198

[border]
width=1
radius=12

[dmenu]
mode=text  # text | index
exit-immediately-if-empty=no/
